name: Live drift check

# Copy to .github/workflows/drift-check.yml in the site repo.

on:
  schedule:
    - cron: '15 11 * * *'    # 07:15 ET, before the workday
  workflow_dispatch:

jobs:
  check:
    uses: nathanmlavalley/site-toolkit/.github/workflows/drift-check.yml@v1.9
    with:
      toolkit_ref: v1.9
      configs: site.config.json
    secrets: inherit
