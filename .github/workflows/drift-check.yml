name: Live drift check

# Reusable workflow. A site repo calls this on a schedule:
#
#   jobs:
#     check:
#       uses: nathanmlavalley/site-toolkit/.github/workflows/drift-check.yml@v1
#       with:
#         configs: site.config.json
#       secrets: inherit
#
# Every deploy already runs the drift check before mirroring, so drift cannot
# be flattened by a deploy. This catches it earlier: a direct edit on a server
# would otherwise sit unnoticed until the next deploy attempt, which then fails
# at whatever moment you happened to be shipping.
#
# Runs on GitHub rather than an always-on machine because CI fails loudly and
# an unattended launchd job does not.

on:
  workflow_call:
    inputs:
      toolkit_ref:
        description: The site-toolkit tag to run. Must equal the ref in the caller's uses line.
        type: string
        required: true
      configs:
        description: Space-separated site.config.json paths to check (FTP and rsync sites)
        type: string
        required: true

    secrets:
      # Optional. Same-owner callers use "secrets: inherit" and the config
      # names which secret holds each value. A caller in ANOTHER org or user
      # account cannot inherit (GitHub limits inherit to the same org), so it
      # maps its own secret names onto these generic ones instead:
      #   secrets:
      #     FTP_HOST: ${{ secrets.STAGING_FTP_HOST }}
      # The scripts fall back to these names when the config's names resolve
      # to nothing.
      FTP_HOST: { required: false }
      FTP_USER: { required: false }
      FTP_PASSWORD: { required: false }
      SSH_PRIVATE_KEY: { required: false }
      NTFY_URL: { required: false }

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SECRETS_JSON: ${{ toJSON(secrets) }}
      SSH_KEY_FILE: ${{ github.workspace }}/.deploy_key
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: nathanmlavalley/site-toolkit
          # A reusable workflow cannot see its own ref (job_workflow_sha resolved
          # empty, and an empty ref checks out main). The caller passes the tag.
          ref: ${{ inputs.toolkit_ref }}
          path: .site-toolkit

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Install the SSH key for rsync sites
        # Same as deploy-rsync.yml. Without this every rsync site errored
        # daily ("Identity file not accessible") and the alert below called
        # it drift, 2026-09-04 to 09-07.
        run: |
          umask 077; mkdir -p ~/.ssh
          for cfg in ${{ inputs.configs }}; do
            eval "$(node .site-toolkit/scripts/config.js --config "$cfg" --shell)"
            [ "$SITE_TRANSPORT" = "rsync" ] || continue
            if [ -n "$SSH_PRIVATE_KEY" ] && [ ! -s "$SSH_KEY_FILE" ]; then
              printf '%s\n' "$SSH_PRIVATE_KEY" > "$SSH_KEY_FILE"
            fi
            host="${SITE_REMOTE#*@}"; host="${host%%:*}"
            for i in 1 2 3; do
              ssh-keyscan -T 15 -p "${SSH_PORT:-22}" -H "$host" >> ~/.ssh/known_hosts 2>/dev/null && break
              sleep 3
            done
          done
          true

      - name: Check every site
        id: check
        run: |
          worst=0; failed=""
          for cfg in ${{ inputs.configs }}; do
            # Capture the real exit status: "if ! cmd" would hand us the
            # negation, which is how an errored check once passed as green.
            rc=0
            node .site-toolkit/scripts/live-check.js --config "$cfg" --deep || rc=$?
            if [ "$rc" -ne 0 ]; then
              [ "$rc" -gt "$worst" ] && worst=$rc
              failed="$failed $cfg"
            fi
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          echo "worst=$worst" >> "$GITHUB_OUTPUT"
          exit $worst

      - name: Remove the SSH key
        if: always()
        run: rm -f "$SSH_KEY_FILE"

      - name: Alert
        if: failure()
        run: |
          first=$(echo "${{ steps.check.outputs.failed }}" | awk '{print $1}')
          [ -n "$first" ] || first=$(echo "${{ inputs.configs }}" | awk '{print $1}')
          eval "$(node .site-toolkit/scripts/config.js --config "$first" --shell)"
          [ -n "$NTFY_URL" ] || exit 0
          # Exit 1 is real drift. Exit 2 means the check itself could not run
          # (credentials, network): say that, not "work not in git".
          if [ "${{ steps.check.outputs.worst }}" = "1" ]; then
            title="Live site has work not in git"; tags="warning"
            body="Drift in:${{ steps.check.outputs.failed }}
          A push will still deploy where the caller allows it; reconcile first if the live edit matters."
          else
            title="Live drift check could not run"; tags="grey_question"
            body="Could not check:${{ steps.check.outputs.failed }}
          Credentials or network, not drift. Nothing on the server was compared."
          fi
          curl -fsS -m 20 \
            -H "Title: $title" -H "Priority: default" -H "Tags: $tags" \
            -d "$body
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "$NTFY_URL" || true
